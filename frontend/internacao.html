<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MedFlow | Internação</title>
<link rel="stylesheet" href="medflow-v2.css">
<style>
body{font-family:Inter,Arial,sans-serif;background:#f6f8fb;color:#172033}.intern-wrap{max-width:1180px;margin:0 auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 20px}.hero h1{font-size:28px;letter-spacing:-.7px}.hero p{margin-top:6px;color:#64748b;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:18px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.stat span{display:block;color:#64748b;font-size:11px}.stat strong{display:block;font-size:27px;margin-top:7px}.layout{display:grid;grid-template-columns:390px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:16px;box-shadow:0 8px 25px rgba(15,23,42,.05);padding:22px}.panel h2{font-size:16px;margin-bottom:5px}.panel .sub{font-size:11px;color:#64748b;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:11px 12px;font:inherit;font-size:12px;outline:none;background:#f8fafc}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{background:#fff;border-color:#5d84ed;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:linear-gradient(135deg,#2563eb,#4f7df3);color:#fff;font-weight:800;cursor:pointer}.list{display:grid;gap:10px;max-height:610px;overflow:auto}.empty{padding:45px 15px;text-align:center;color:#64748b;border:1px dashed #dbe2ea;border-radius:12px}.item{border:1px solid #e5eaf1;border-radius:13px;padding:15px;background:#fff}.item-top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:14px}.badge{font-size:10px;font-weight:800;color:#166534;background:#dcfce7;padding:5px 8px;border-radius:999px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta div{background:#f8fafc;border-radius:9px;padding:8px}.meta span{display:block;color:#64748b;font-size:9px}.meta strong{font-size:11px}.item small{display:block;color:#64748b;margin-top:10px}.alta{margin-top:12px;border:1px solid #fecaca;background:#fff7f7;color:#b91c1c;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:700;cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.stats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.hero{display:block}}
</style>
</head>
<body>
<div class="intern-wrap">
<div class="hero"><div><h1>Internação</h1><p>Controle de pacientes internados, leitos e setores.</p></div></div>
<div class="stats"><div class="stat"><span>Internados agora</span><strong id="total">0</strong></div><div class="stat"><span>Leitos ocupados</span><strong id="leitos">0</strong></div><div class="stat"><span>Última internação</span><strong id="ultima">—</strong></div></div>
<div class="layout">
<section class="panel"><h2>Nova internação</h2><div class="sub">Registre a entrada do paciente no hospital.</div>
<div class="field"><label>Paciente *</label><select id="paciente"><option value="">Selecione o paciente</option></select></div>
<div class="grid2"><div class="field"><label>Setor *</label><select id="setor"><option>Clínica médica</option><option>Clínica cirúrgica</option><option>Pediatria</option><option>UTI</option><option>Observação</option><option>Outro</option></select></div><div class="field"><label>Leito *</label><input id="leito" placeholder="Ex.: A-102"></div></div>
<div class="field"><label>Motivo da internação</label><input id="motivo" placeholder="Ex.: acompanhamento clínico"></div>
<div class="field"><label>Diagnóstico</label><input id="diagnostico" placeholder="Diagnóstico inicial"></div>
<div class="field"><label>Médico responsável</label><input id="medico" placeholder="Nome do médico"></div>
<div class="field"><label>Observações</label><textarea id="observacoes" placeholder="Cuidados, restrições ou informações importantes"></textarea></div>
<button class="primary" id="salvar">🛏️ Confirmar internação</button><div id="msg" style="min-height:20px;text-align:center;font-size:11px;font-weight:700;margin-top:10px"></div>
</section>
<section class="panel"><h2>Pacientes internados</h2><div class="sub">Acompanhamento das internações ativas.</div><div id="lista" class="list"><div class="empty">Carregando internações...</div></div></section>
</div></div>
<script src="medflow-v2.js"></script>
<script>
if(sessionStorage.getItem('medflow_tipo')!=='medico'){location.href='index.html'}
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function msg(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#16a34a':'#dc2626'}
async function pacientes(){const r=await fetch('/pacientes');const ps=await r.json();$('paciente').innerHTML='<option value="">Selecione o paciente</option>'+ps.filter(p=>p.status!=='alta').map(p=>`<option value="${esc(p.id)}">${esc(p.nome)}${p.cpf?' — '+esc(p.cpf):''}</option>`).join('')}
function dataBR(v){if(!v)return '—';return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
async function carregar(){const r=await fetch('/internacoes?status=internado',{cache:'no-store'});const list=await r.json();$('total').textContent=list.length;$('leitos').textContent=new Set(list.map(i=>i.leito).filter(Boolean)).size;$('ultima').textContent=list[0]?dataBR(list[0].dataInternacao).split(',')[0]:'—';$('lista').innerHTML=list.length?list.map(i=>`<article class="item"><div class="item-top"><div class="name">${esc(i.paciente)}</div><span class="badge">INTERNADO</span></div><div class="meta"><div><span>Setor</span><strong>${esc(i.setor)}</strong></div><div><span>Leito</span><strong>${esc(i.leito)}</strong></div><div><span>Entrada</span><strong>${dataBR(i.dataInternacao)}</strong></div><div><span>Médico</span><strong>${esc(i.medicoResponsavel||'Não informado')}</strong></div></div>${i.diagnostico?`<small><b>Diagnóstico:</b> ${esc(i.diagnostico)}</small>`:''}<button class="alta" onclick="darAlta('${esc(i.patientId)}','${esc(i.paciente)}')">🏁 Registrar alta</button></article>`).join(''):'<div class="empty">Nenhum paciente internado no momento.</div>'}
async function salvar(){const patientId=$('paciente').value,leito=$('leito').value.trim(),setor=$('setor').value;if(!patientId||!leito||!setor){msg('Preencha paciente, setor e leito.');return}const b=$('salvar');b.disabled=true;b.textContent='Registrando...';try{const r=await fetch('/internacao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId,leito,setor,motivo:$('motivo').value.trim(),diagnostico:$('diagnostico').value.trim(),medicoResponsavel:$('medico').value.trim(),observacoes:$('observacoes').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível registrar.');msg('Internação registrada com sucesso.',true);['leito','motivo','diagnostico','medico','observacoes'].forEach(id=>$(id).value='');$('paciente').value='';await pacientes();await carregar()}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='🛏️ Confirmar internação'}}
async function darAlta(patientId,nome){if(!confirm('Registrar alta de '+nome+'?'))return;try{const r=await fetch('/alta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId,diagnostico:'Alta hospitalar',medicoResponsavel:sessionStorage.getItem('medflow_usuario')||''})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Erro ao registrar alta');await carregar();await pacientes();alert('Alta registrada com sucesso.')}catch(e){alert(e.message)}}
$('salvar').onclick=salvar;pacientes();carregar();setInterval(carregar,10000);
</script>
</body></html>
